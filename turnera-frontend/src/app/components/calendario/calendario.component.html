<div class="container-fluid demo-app fc-theme-bootstrap5">

  <!-- Calendario principal -->
  <div class="col demo-app-main d-flex fc-theme-bootstrap5">
    <full-calendar *ngIf="calendarVisible()" [options]="calendarOptions()">
      <ng-template #eventContent let-arg>
        <b>{{ arg.timeText }}</b>
        <i>{{ arg.event.title }}</i>
      </ng-template>
    </full-calendar>
  </div>
</div>
